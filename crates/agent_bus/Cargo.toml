[package]
name = "warp-agent-bus"
version = "0.1.0"
edition = "2021"
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
async-tungstenite = { version = "0.28.2", features = ["tokio-runtime"] }
chrono.workspace = true
futures-util = { workspace = true, features = ["sink"] }
diesel = { workspace = true, features = ["sqlite"] }
libsqlite3-sys = { version = "0.33.0", features = ["bundled"] }
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
rand.workspace = true
subtle = "=2.6.1"
schemars.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "io-std", "process"] }
uuid.workspace = true
unicode-segmentation = "=1.11.0"
remote_protocol.workspace = true
sysinfo.workspace = true
tokio-util = { workspace = true, features = ["compat"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes"] }

[[bin]]
name = "warp-agent"
path = "src/main.rs"

[[bin]]
name = "warpai-companion"
path = "src/companion_main.rs"

[dev-dependencies]
serde_yaml.workspace = true
tempfile.workspace = true
toml = "0.8.13"
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tokio = { workspace = true, features = ["process"] }
