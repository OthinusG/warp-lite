name: Validate Warpai communication
on:
  workflow_dispatch:
    inputs:
      protocol_only:
        description: 'Run both OS protocol suites; desktop checks require check_app or capture_ui'
        type: boolean
        default: false
      check_app:
        description: 'Include both desktop builds and application tests in protocol-only runs'
        type: boolean
        default: false
      native_windows_only:
        description: 'Run only the Windows native capture, reusing compiled Rust outputs'
        type: boolean
        default: false
      capture_ui:
        description: 'Build debug apps and run isolated native static and live UI captures'
        type: boolean
        default: false
  push:
    branches: ['main']
permissions:
  contents: read
concurrency:
  group: agent-communication-${{ github.ref }}-${{ inputs.protocol_only }}-${{ inputs.check_app }}-${{ inputs.capture_ui }}-${{ inputs.native_windows_only }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          lfs: true
      - name: Keep source inputs in LF on Windows
        run: |
          git config core.autocrlf false
          git checkout-index --force --all
      - name: Install pinned Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Prepare Windows protobuf compiler
        run: choco install protoc -y
      - name: Prepare native Windows SSH acceptance server
        if: ${{ inputs.capture_ui || inputs.native_windows_only }}
        shell: pwsh
        run: Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
      - name: Restore Windows native Rust outputs
        if: ${{ inputs.capture_ui || inputs.native_windows_only }}
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-native-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: windows-native-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Build native capture companion and bridge
        if: ${{ inputs.native_windows_only }}
        run: cargo build -p warp-agent-bus --bins --locked
      - name: Test protocol, persistence, native sockets, and MCP
        if: ${{ !inputs.native_windows_only }}
        run: cargo test -p warp-agent-bus --locked
      - name: Verify representative history and indexed query budget
        if: ${{ !inputs.native_windows_only }}
        run: cargo test -p warp-agent-bus --lib representative_history_pages_within_budget_and_preserves_live_work --locked -- --ignored --nocapture
      - name: Upload tested native bridge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Warpai-agent-bridge-Windows-debug
          path: target/debug/warpai-agent.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows readiness acceptance executable
        if: ${{ !inputs.native_windows_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-readiness-Windows
          path: target/debug/deps/readiness-*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Check Windows default and platform application
        if: ${{ !inputs.native_windows_only && (!inputs.protocol_only || inputs.capture_ui || inputs.check_app) }}
        run: |
          cargo test -p remote_server --locked
          cargo check -p warpai --bin warpai --locked
          cargo check -p warpai --bin warpai --features warp_platform --locked
      - name: Verify Windows legacy metadata and credential cleanup
        if: ${{ !inputs.native_windows_only && (!inputs.protocol_only || inputs.check_app) }}
        run: |
          cargo test -p warpai --lib legacy_credential_cleanup_preserves_other_keys_and_reports_failures --locked
          cargo test -p warpai --lib agent_communication::codex_launch::tests --locked
          cargo test -p warpai --lib companion_transport_preserves_destination_and_native_authentication_paths --locked
          cargo test -p warpai --lib powershell_subshell_initialization_emits_native_session_hook --locked
          cargo test -p warpai --lib terminal_ssh_session_ --locked
          cargo test -p warpai --lib codex_pending_launch_is_canceled_by_both_ctrl_c_paths --locked
          cargo test -p warpai --lib user_data_migration::tests --locked
          cargo test -p warpai --lib settings::init::tests --locked
          cargo test -p warp_core --features local_fs --lib paths::tests --locked
          cargo test -p warpai --lib legacy_remote_profiles_are_read_only_metadata_and_preserve_local_selection --locked
          cargo test -p warpai --lib file_location_respects_remote_path_flavor --locked
      - name: Build Windows native review executable
        if: ${{ inputs.capture_ui || inputs.native_windows_only }}
        shell: pwsh
        env:
          CARGO_FULL_PROFILE: debug
          CARGO_BIN_NAME: oss
          WARP_APP_NAME: Warpai
        run: |
          cargo build -p warpai --bin warpai --features "release_bundle,gui,nld_improvements" --locked
          if ($LASTEXITCODE -ne 0) { throw "Native review compilation failed" }
          # The debug executable needs the same native runtime files as the portable package.
          foreach ($dll in @('conpty.dll', 'dxcompiler.dll', 'dxil.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            Copy-Item "app/assets/windows/x64/$dll" "target/debug/$dll" -Force
          }
          Copy-Item 'app/assets/bundled/bootstrap/pwsh.ps1' 'target/debug/pwsh.ps1' -Force
          New-Item -ItemType Directory -Path 'target/debug/x64' -Force | Out-Null
          Copy-Item 'app/assets/windows/x64/OpenConsole.exe' 'target/debug/x64/OpenConsole.exe' -Force
      - name: Save Windows native Rust outputs
        if: ${{ (inputs.capture_ui || inputs.native_windows_only) && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Capture Windows static collaboration UI
        if: ${{ inputs.capture_ui || inputs.native_windows_only }}
        timeout-minutes: 7
        shell: pwsh
        env:
          WARP_COLLABORATION_CAPTURE: ${{ runner.temp }}/collaboration-ui-windows
          WARP_TEST_COMPANION: ${{ github.workspace }}/target/debug/warpai-companion.exe
        run: |
          $ordinaryMigrationMarker = Join-Path $env:USERPROFILE '.config/.warpai/.legacy-migration-complete'
          $ordinaryMigrationExisted = Test-Path -LiteralPath $ordinaryMigrationMarker
          $captureProcess = Start-Process -FilePath "python" -ArgumentList @("script/verify-ssh-file-tools.py", "--capture", "$PWD/target/debug/warpai.exe") -WorkingDirectory "$PWD" -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/collaboration-capture.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/collaboration-capture.stderr.log"
          if (!$ordinaryMigrationExisted -and (Test-Path -LiteralPath $ordinaryMigrationMarker)) { throw "Native capture migrated ordinary user data" }
          # Keep only panic source locations, never the raw application log or payload.
          $locations = @(Select-String -Path "$env:RUNNER_TEMP/collaboration-capture.stderr.log" -Pattern '([A-Za-z0-9_./\\-]+\.rs:[0-9]+:[0-9]+)' -AllMatches | ForEach-Object { $_.Matches.Value } | Select-Object -Unique)
          New-Item -ItemType Directory -Path $env:WARP_COLLABORATION_CAPTURE -Force | Out-Null
          python script/test-native-capture-diagnostic.py
          python script/native-capture-diagnostic.py --log "$env:RUNNER_TEMP/collaboration-capture.stdout.log" --log "$env:RUNNER_TEMP/collaboration-capture.stderr.log" --output "$env:WARP_COLLABORATION_CAPTURE/diagnostic.json" --exit-code $captureProcess.ExitCode
          if ($LASTEXITCODE -ne 0) { throw "Capture diagnostics failed" }
          if ($captureProcess.ExitCode -ne 0) {
            Write-Host "Native panic source locations: $($locations -join ', ')"
            throw "Native capture failed: $($captureProcess.ExitCode)"
          }
          $images = @(Get-ChildItem $env:WARP_COLLABORATION_CAPTURE -Recurse -Filter '*.png')
          $fixtureCount = @(Get-Content 'specs/agent-communication-v2/panel-fixtures.json' -Raw | ConvertFrom-Json).Count
          $expectedImages = $fixtureCount * 8 + 87
          if ($images.Count -ne $expectedImages -or @($images | Where-Object Length -eq 0).Count -ne 0) { throw "Expected $expectedImages nonempty native PNGs" }
      - name: Upload Windows native UI captures
        if: ${{ always() && (inputs.capture_ui || inputs.native_windows_only) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-collaboration-native-captures-Windows
          path: |
            ${{ runner.temp }}/collaboration-ui-windows/**/*.png
            ${{ runner.temp }}/collaboration-ui-windows/diagnostic.json
          if-no-files-found: warn
          retention-days: 7
  macos:
    if: ${{ !inputs.native_windows_only }}
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          lfs: true
      - name: Verify source hygiene
        run: git diff --check
      - name: Prepare build tools
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --find metal
          HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
      - name: Test protocol and reversible native setup
        run: cargo test -p warp-agent-bus --locked
      - name: Verify representative history and indexed query budget
        run: cargo test -p warp-agent-bus --lib representative_history_pages_within_budget_and_preserves_live_work --locked -- --ignored --nocapture
      - name: Diagnose native build tools on failure
        if: failure()
        run: |
          uname -m
          rustc -vV
          find target/debug/build -name build-script-build -exec file {} \; | head -30
      - name: Upload tested native bridge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Warpai-agent-bridge-macOS-debug
          path: target/debug/warpai-agent
          if-no-files-found: error
          retention-days: 7
      - name: Collect readiness acceptance executable
        run: |
          mkdir -p acceptance
          find target/debug/deps -type f -name 'readiness-*' -perm -111 -exec cp {} acceptance/ \;
      - name: Upload macOS readiness acceptance executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-readiness-macOS
          path: acceptance/readiness-*
          if-no-files-found: error
          retention-days: 7
      - name: Check default Warpai application
        if: ${{ !inputs.protocol_only || inputs.capture_ui || inputs.check_app }}
        run: |
          cargo test -p remote_server --locked
          cargo check -p warpai --bin warpai --locked
      - name: Check platform application
        if: ${{ !inputs.protocol_only || inputs.capture_ui || inputs.check_app }}
        run: cargo check -p warpai --bin warpai --features warp_platform --locked
      - name: Test dormant wake and settings configuration
        if: ${{ !inputs.protocol_only || inputs.check_app }}
        run: |
          cargo test -p warpai --lib lite_app_menu_builds_without_platform_bindings --locked
          cargo test -p warpai --lib collaboration_ --locked
          cargo test -p warpai --lib agent_communication::setup::tests::legacy_warp_agent_mcp_entries_are_removed_without_touching_other_servers --locked
          cargo test -p warpai --lib native_intent_requires_explicit_fields_and_typed_override --locked
          cargo test -p warpai --lib peer_wake_submits_to_dormant_agent_and_cancels_stale_enter --locked
          cargo test -p warpai --lib managed_configuration_is_reversible_and_preserves_user_settings --locked
          cargo test -p warpai --lib legacy_credential_cleanup_preserves_other_keys_and_reports_failures --locked
          cargo test -p warpai --lib agent_communication::codex_launch::tests --locked
          cargo test -p warpai --lib companion_transport_preserves_destination_and_native_authentication_paths --locked
          cargo test -p warpai --lib powershell_subshell_initialization_emits_native_session_hook --locked
          cargo test -p warpai --lib terminal_ssh_session_ --locked
          cargo test -p warpai --lib codex_pending_launch_is_canceled_by_both_ctrl_c_paths --locked
          cargo test -p warpai --lib user_data_migration::tests --locked
          cargo test -p warpai --lib settings::init::tests --locked
          cargo test -p warp_core --features local_fs --lib paths::tests --locked
          cargo test -p warpui_extras --lib --features secure_storage keychain_access_errors_do_not_prove_missing_credentials --locked
          cargo test -p warpai --lib legacy_remote_profiles_are_read_only_metadata_and_preserve_local_selection --locked
          cargo test -p warpai --lib file_location_respects_remote_path_flavor --locked
          cargo test -p warpai --lib every_managed_alias_has_native_setup_and_vibe_keeps_bindings_in_memory --locked
          cargo test -p warpai --lib native_cli_setup_checks_ownership_and_is_reversible --locked
          cargo test -p warpai --lib opaque_approval_and_question_notifications_never_announce_idle --locked
          cargo test -p warpai --lib peer_prompt_delivery_excludes_batch_and_protocol_launches --locked
          cargo test -p warpai --lib test_detect_qoder --locked
      - name: Build isolated native UI review artifact
        if: ${{ inputs.capture_ui }}
        run: |
          cargo build -p warpai --bin warpai --features release_bundle --locked
          script/build-warpai-app.sh --debug
          codesign --verify --deep --strict WarpaiReview.app
          ditto -c -k --sequesterRsrc --keepParent WarpaiReview.app WarpaiReview.app.zip
      - name: Upload isolated native UI review artifact
        if: ${{ inputs.capture_ui }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-collaboration-UI-review-macos
          path: WarpaiReview.app.zip
          retention-days: 7
      - name: Capture macOS static collaboration UI
        if: ${{ inputs.capture_ui }}
        timeout-minutes: 7
        env:
          WARP_COLLABORATION_CAPTURE: ${{ runner.temp }}/collaboration-ui-macos
          WARP_TEST_COMPANION: ${{ github.workspace }}/target/debug/warpai-companion
        run: |
          ordinary_marker="$HOME/.config/.warpai/.legacy-migration-complete"
          ordinary_before=0
          if [[ -e "$ordinary_marker" ]]; then ordinary_before=1; fi
          capture_exit=0
          python3 script/verify-ssh-file-tools.py --capture WarpaiReview.app/Contents/MacOS/Warpai > "$RUNNER_TEMP/collaboration-capture.log" 2>&1 || capture_exit=$?
          if [[ "$ordinary_before" == 0 ]]; then test ! -e "$ordinary_marker"; fi
          python3 script/test-native-capture-diagnostic.py
          python3 script/native-capture-diagnostic.py --log "$RUNNER_TEMP/collaboration-capture.log" --output "$WARP_COLLABORATION_CAPTURE/diagnostic.json" --exit-code "$capture_exit"
          test "$capture_exit" -eq 0
          python3 - <<'PY'
          import os
          from pathlib import Path
          images = list(Path(os.environ['WARP_COLLABORATION_CAPTURE']).rglob('*.png'))
          import json
          fixtures = json.loads(Path('specs/agent-communication-v2/panel-fixtures.json').read_text())
          expected = len(fixtures) * 8 + 87
          assert len(images) == expected and all(image.stat().st_size > 0 for image in images), f'Expected {expected} nonempty native PNGs'
          PY
      - name: Upload macOS native UI captures
        if: ${{ always() && inputs.capture_ui }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-collaboration-native-captures-macOS
          path: |
            ${{ runner.temp }}/collaboration-ui-macos/**/*.png
            ${{ runner.temp }}/collaboration-ui-macos/diagnostic.json
          if-no-files-found: warn
          retention-days: 7
