name: Validate Warpai communication
on:
  workflow_dispatch:
    inputs:
      protocol_only:
        description: 'Run both OS protocol suites; skip application checks/releases (capture_ui still builds debug UI)'
        type: boolean
        default: false
      capture_ui:
        description: 'Run the isolated native static and live capture harness after packaging'
        type: boolean
        default: false
      soak:
        description: 'Run deterministic backend soak in two four-hour phases per OS after full validation'
        type: boolean
        default: false
  push:
    branches: ['warp-lite/main', 'warp-lite/agent-communication']
permissions:
  contents: read
concurrency:
  group: agent-communication-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          lfs: true
      - name: Keep source inputs in LF on Windows
        run: |
          git config core.autocrlf false
          git checkout-index --force --all
      - name: Install pinned Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Test protocol, persistence, native sockets, and MCP
        run: cargo test -p warp-agent-bus --locked
      - name: Verify representative history and indexed query budget
        run: cargo test -p warp-agent-bus --lib representative_history_pages_within_budget_and_preserves_live_work --locked -- --ignored --nocapture
      - name: Upload tested native bridge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Warpai-agent-bridge-Windows-debug
          path: target/debug/warp-agent.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows readiness acceptance executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-readiness-Windows
          path: target/debug/deps/readiness-*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Prepare Windows application build
        if: ${{ !inputs.protocol_only || inputs.capture_ui }}
        shell: pwsh
        run: |
          choco install protoc innosetup -y
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check Windows default and platform application
        if: ${{ !inputs.protocol_only }}
        run: |
          cargo check -p warp --bin warp-oss --locked
          cargo check -p warp --bin warp-oss --features warp_platform --locked
      - name: Prepare Windows packaging dependencies
        if: ${{ !inputs.protocol_only }}
        run: bash script/install_cargo_release_deps
      - name: Build and package Windows review artifacts
        if: ${{ !inputs.protocol_only }}
        shell: pwsh
        run: script/build-warp-lite-windows.ps1 -ReleaseTag "0.5.7-review"
      - name: Upload Windows review artifacts
        if: ${{ !inputs.protocol_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-agent-communication-windows
          path: |
            WarpaiSetup-x64.exe
            Warpai-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
      - name: Build Windows native review executable
        if: ${{ inputs.capture_ui }}
        shell: pwsh
        env:
          CARGO_FULL_PROFILE: debug
          CARGO_BIN_NAME: oss
          WARP_APP_NAME: Warpai
        run: |
          cargo build -p warp --bin warp-oss --features "release_bundle,gui,nld_improvements" --locked
          if ($LASTEXITCODE -ne 0) { throw "Native review compilation failed" }
          # The debug executable needs the same native runtime files as the portable package.
          foreach ($dll in @('conpty.dll', 'dxcompiler.dll', 'dxil.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            Copy-Item "app/assets/windows/x64/$dll" "target/debug/$dll" -Force
          }
          Copy-Item 'app/assets/bundled/bootstrap/pwsh.ps1' 'target/debug/pwsh.ps1' -Force
          New-Item -ItemType Directory -Path 'target/debug/x64' -Force | Out-Null
          Copy-Item 'app/assets/windows/x64/OpenConsole.exe' 'target/debug/x64/OpenConsole.exe' -Force
      - name: Capture Windows static collaboration UI
        if: ${{ inputs.capture_ui }}
        timeout-minutes: 7
        shell: pwsh
        env:
          WARP_COLLABORATION_CAPTURE: ${{ runner.temp }}/collaboration-ui-windows
        run: |
          $captureProcess = Start-Process -FilePath "$PWD/target/debug/warp-oss.exe" -WorkingDirectory "$PWD/target/debug" -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/collaboration-capture.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/collaboration-capture.stderr.log"
          # Keep only panic source locations, never the raw application log or payload.
          $locations = @(Select-String -Path "$env:RUNNER_TEMP/collaboration-capture.stderr.log" -Pattern '([A-Za-z0-9_./\\-]+\.rs:[0-9]+:[0-9]+)' -AllMatches | ForEach-Object { $_.Matches.Value } | Select-Object -Unique)
          New-Item -ItemType Directory -Path $env:WARP_COLLABORATION_CAPTURE -Force | Out-Null
          python script/test-native-capture-diagnostic.py
          python script/native-capture-diagnostic.py --log "$env:RUNNER_TEMP/collaboration-capture.stdout.log" --log "$env:RUNNER_TEMP/collaboration-capture.stderr.log" --output "$env:WARP_COLLABORATION_CAPTURE/diagnostic.json" --exit-code $captureProcess.ExitCode
          if ($LASTEXITCODE -ne 0) { throw "Capture diagnostics failed" }
          if ($captureProcess.ExitCode -ne 0) {
            Write-Host "Native panic source locations: $($locations -join ', ')"
            throw "Native capture failed: $($captureProcess.ExitCode)"
          }
          $images = @(Get-ChildItem $env:WARP_COLLABORATION_CAPTURE -Recurse -Filter '*.png')
          if ($images.Count -ne 112 -or @($images | Where-Object Length -eq 0).Count -ne 0) { throw "Expected 112 nonempty native PNGs" }
      - name: Upload Windows native UI captures
        if: ${{ always() && inputs.capture_ui }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-collaboration-native-captures-Windows
          path: |
            ${{ runner.temp }}/collaboration-ui-windows/**/*.png
            ${{ runner.temp }}/collaboration-ui-windows/diagnostic.json
          if-no-files-found: warn
          retention-days: 7
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          lfs: true
      - name: Verify source hygiene
        run: git diff --check
      - name: Prepare build tools
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --find metal
          HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
      - name: Test protocol and reversible native setup
        run: cargo test -p warp-agent-bus --locked
      - name: Verify representative history and indexed query budget
        run: cargo test -p warp-agent-bus --lib representative_history_pages_within_budget_and_preserves_live_work --locked -- --ignored --nocapture
      - name: Diagnose native build tools on failure
        if: failure()
        run: |
          uname -m
          rustc -vV
          find target/debug/build -name build-script-build -exec file {} \; | head -30
      - name: Upload tested native bridge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Warpai-agent-bridge-macOS-debug
          path: target/debug/warp-agent
          if-no-files-found: error
          retention-days: 7
      - name: Collect readiness acceptance executable
        run: |
          mkdir -p acceptance
          find target/debug/deps -type f -name 'readiness-*' -perm -111 -exec cp {} acceptance/ \;
      - name: Upload macOS readiness acceptance executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-readiness-macOS
          path: acceptance/readiness-*
          if-no-files-found: error
          retention-days: 7
      - name: Check default Lite application
        if: ${{ !inputs.protocol_only }}
        run: cargo check -p warp --bin warp-oss --locked
      - name: Check platform application
        if: ${{ !inputs.protocol_only }}
        run: cargo check -p warp --bin warp-oss --features warp_platform --locked
      - name: Test dormant wake and settings configuration
        if: ${{ !inputs.protocol_only }}
        run: |
          cargo test -p warp --lib lite_app_menu_builds_without_platform_bindings --locked
          cargo test -p warp --lib collaboration_fixtures_cover_required_states_and_long_content --locked
          cargo test -p warp --lib native_intent_requires_explicit_fields_and_typed_override --locked
          cargo test -p warp --lib peer_wake_submits_to_dormant_agent_and_cancels_stale_enter --locked
          cargo test -p warp --lib managed_configuration_is_reversible_and_preserves_user_settings --locked
          cargo test -p warp --lib every_managed_alias_has_native_setup_and_vibe_keeps_bindings_in_memory --locked
          cargo test -p warp --lib native_cli_setup_checks_ownership_and_is_reversible --locked
          cargo test -p warp --lib opaque_approval_and_question_notifications_never_announce_idle --locked
          cargo test -p warp --lib peer_prompt_delivery_excludes_batch_and_protocol_launches --locked
          cargo test -p warp --lib test_detect_qoder --locked
      - name: Build isolated native UI review artifact
        if: ${{ !inputs.protocol_only || inputs.capture_ui }}
        run: |
          cargo build -p warp --bin warp-oss --features release_bundle --locked
          script/build-warp-lite-app.sh --debug
          codesign --verify --deep --strict WarpaiReview.app
          ditto -c -k --sequesterRsrc --keepParent WarpaiReview.app WarpaiReview.app.zip
      - name: Upload isolated native UI review artifact
        if: ${{ !inputs.protocol_only || inputs.capture_ui }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-collaboration-UI-review-macos
          path: WarpaiReview.app.zip
          retention-days: 7
      - name: Build and package review artifacts
        if: ${{ !inputs.protocol_only }}
        run: |
          cargo build --release --bin warp-oss --locked
          cargo build --release -p warp-agent-bus --bin warp-agent --locked
          script/build-warp-lite-app.sh
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Warpai.app/Contents/Info.plist | grep -qx Warpai
          test -x Warpai.app/Contents/MacOS/Warpai
          codesign --verify --deep --strict Warpai.app
          ditto -c -k --sequesterRsrc --keepParent Warpai.app Warpai.app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.protocol_only }}
        with:
          name: Warpai-agent-communication-macos
          path: Warpai.app.zip
          retention-days: 7
      - name: Capture macOS static collaboration UI
        if: ${{ inputs.capture_ui }}
        timeout-minutes: 7
        env:
          WARP_COLLABORATION_CAPTURE: ${{ runner.temp }}/collaboration-ui-macos
        run: |
          capture_exit=0
          WarpaiReview.app/Contents/MacOS/Warpai > "$RUNNER_TEMP/collaboration-capture.log" 2>&1 || capture_exit=$?
          python3 script/test-native-capture-diagnostic.py
          python3 script/native-capture-diagnostic.py --log "$RUNNER_TEMP/collaboration-capture.log" --output "$WARP_COLLABORATION_CAPTURE/diagnostic.json" --exit-code "$capture_exit"
          test "$capture_exit" -eq 0
          python3 - <<'PY'
          import os
          from pathlib import Path
          images = list(Path(os.environ['WARP_COLLABORATION_CAPTURE']).rglob('*.png'))
          assert len(images) == 112 and all(image.stat().st_size > 0 for image in images), 'Expected 112 nonempty native PNGs'
          PY
      - name: Upload macOS native UI captures
        if: ${{ always() && inputs.capture_ui }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-collaboration-native-captures-macOS
          path: |
            ${{ runner.temp }}/collaboration-ui-macos/**/*.png
            ${{ runner.temp }}/collaboration-ui-macos/diagnostic.json
          if-no-files-found: warn
          retention-days: 7
  soak_phase1:
    if: ${{ inputs.soak && !inputs.protocol_only }}
    needs: [macos, protocol]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          lfs: true
      - name: Keep source inputs in LF on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --force --all
      - name: Install pinned Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify soak orchestration
        run: python script/test-agent-communication-soak.py
      - name: Four-hour protocol restart and history soak
        run: python script/soak-agent-communication.py --phase 1 --report "${{ runner.temp }}/agent-soak/phase-one.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Warpai-soak-phase1-${{ runner.os }}
          path: ${{ runner.temp }}/agent-soak/phase-one.json
          if-no-files-found: warn
          retention-days: 7
  soak_phase2:
    if: ${{ inputs.soak && !inputs.protocol_only }}
    needs: soak_phase1
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          lfs: true
      - name: Keep source inputs in LF on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --force --all
      - name: Install pinned Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a108a0bac45b974a6288108c90dbdf5c8093
        with:
          name: Warpai-soak-phase1-${{ runner.os }}
          path: ${{ runner.temp }}/agent-soak
      - name: Complete eight-hour source-matched backend soak
        run: python script/soak-agent-communication.py --phase 2 --previous "${{ runner.temp }}/agent-soak/phase-one.json" --report "${{ runner.temp }}/agent-soak/phase-two.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Warpai-soak-eight-hour-${{ runner.os }}
          path: ${{ runner.temp }}/agent-soak/phase-two.json
          if-no-files-found: warn
          retention-days: 7
