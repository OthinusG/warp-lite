name: Validate Warpai remote companion
on:
  workflow_dispatch:
  push:
    branches: ['main']
permissions:
  contents: read
concurrency:
  group: remote-companion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wire:
    name: Remote wire (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_RUSTFLAGS: ''
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          lfs: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Install Linux protobuf compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
      - name: Install macOS protobuf compiler
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
      - name: Install Windows protobuf compiler
        if: runner.os == 'Windows'
        run: choco install protoc -y
      - name: Verify shared control wire without desktop dependencies
        run: cargo test -p remote_protocol --locked
      - name: Lint shared control wire
        run: cargo clippy -p remote_protocol --all-targets --locked -- -D warnings
      - name: Verify private project communication and standalone companion
        run: |
          cargo test -p warp-agent-bus --lib companion:: --locked
          cargo test -p warp-agent-bus --test companion --locked
          cargo test -p warp-agent-bus --test native_pty --locked
          cargo test -p warp-agent-bus --test managed_agent --locked
          cargo test -p warp-agent-bus --lib ssh_remote::tests --locked
          cargo test -p warp-agent-bus --test ssh_companion --no-run --locked
      - name: Verify local communication and retained history migrations
        run: |
          cargo test -p warp-agent-bus --lib storage::tests --locked
          cargo test -p warp-agent-bus --test coordination --locked
          cargo test -p warp-agent-bus --test local_spaces --locked
      - name: Verify real controlled SSH companion on Linux
        if: runner.os == 'Linux'
        env:
          WARP_TEST_SSH_CONFIG: ${{ runner.temp }}/warpai-ssh-fixture/client.conf
          WARP_TEST_REMOTE_ROOT: ${{ runner.temp }}/SSH project with spaces 多语言
        run: |
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          fixture_dir="$HOME/warpai-ssh-fixture"
          export WARP_TEST_SSH_CONFIG="$fixture_dir/client.conf"
          mkdir -m 700 "$fixture_dir"
          mkdir -p "$WARP_TEST_REMOTE_ROOT"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture_dir/host"
          ssh-keygen -q -t ed25519 -N '' -f "$fixture_dir/client"
          awk '{print "[127.0.0.1]:22222 "$1" "$2}' "$fixture_dir/host.pub" > "$fixture_dir/known_hosts"
          cat > "$fixture_dir/server.conf" <<EOF
          Port 22222
          ListenAddress 127.0.0.1
          HostKey $fixture_dir/host
          PidFile $fixture_dir/sshd.pid
          AuthorizedKeysFile $fixture_dir/client.pub
          AllowUsers $(id -un)
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM yes
          PermitRootLogin no
          StrictModes yes
          EOF
          cat > "$WARP_TEST_SSH_CONFIG" <<EOF
          Host warpai-test
            HostName 127.0.0.1
            User $(id -un)
            Port 22222
            IdentityFile $fixture_dir/client
            IdentitiesOnly yes
            UserKnownHostsFile $fixture_dir/known_hosts
          EOF
          sudo /usr/sbin/sshd -f "$fixture_dir/server.conf" -E "$fixture_dir/server.log"
          trap 'sudo kill "$(cat "$fixture_dir/sshd.pid")"; rm -rf "$fixture_dir"' EXIT
          export WARP_TEST_COMPANION_PATH="$PWD/target/debug/warpai-companion"
          if ! python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          fixture = next(path for path in Path('target/debug/deps').glob('managed_agent-*') if path.is_file() and os.access(path, os.X_OK))
          os.environ['WARP_TEST_AGENT_FIXTURE'] = str(fixture.resolve())
          raise SystemExit(subprocess.run(['cargo', 'test', '-p', 'warp-agent-bus', '--test', 'ssh_companion', '--locked', '--', '--ignored']).returncode)
          PY
          then
            sudo python3 - "$fixture_dir/server.log" <<'PY'
          import sys
          from pathlib import Path
          log = Path(sys.argv[1]).read_text()
          for marker in ['bad ownership or modes', 'not allowed because account is locked', 'Accepted publickey', 'Failed publickey', 'Could not open user', 'Authentication refused']:
              if marker in log:
                  print('Controlled SSH diagnostic: ' + marker)
          PY
            exit 1
          fi
      - name: Prepare source-matched companion review artifact
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          target = next(line.split(': ', 1)[1] for line in subprocess.check_output(['rustc', '-vV'], text=True).splitlines() if line.startswith('host: '))
          binary = Path('target/debug/warpai-companion' + ('.exe' if os.name == 'nt' else ''))
          output = Path('companion-review')
          output.mkdir()
          shutil.copy2(binary, output / binary.name)
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          (output / 'SHA256SUMS').write_text(digest + '  ' + binary.name + '\n')
          version = subprocess.check_output([str(binary.resolve()), '--version'], text=True).strip()
          (output / 'manifest.json').write_text(json.dumps({'source': os.environ['GITHUB_SHA'], 'repository': os.environ['GITHUB_REPOSITORY'], 'target': target, 'version': version, 'profile': 'debug', 'capabilities': ['project_open', 'managed_agent', 'project_tasks', 'project_mcp'], 'sha256': digest}, indent=2) + '\n')
          for notice in ['FORK_NOTICE.md', 'LICENSE-AGPL']:
              shutil.copy2(notice, output / notice)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-companion-review-${{ runner.os }}-${{ runner.arch }}
          path: companion-review/
          if-no-files-found: error
          retention-days: 7
