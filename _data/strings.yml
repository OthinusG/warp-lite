        title: 回归测试
        who: 智能体 B · worktree B
        state: 评审中
        tone: review
      - id: t-03
        title: 文档更新
        who: 智能体 C · worktree C
        state: 已接受
        tone: done
    result: 评审者检查了提交的差异与测试记录并接受结果。协调者集成被接受的成果，完成最终提交。
    ready: "3 个任务中已接受 2 个"
    foot_link: 了解协作流程
  pocket:
