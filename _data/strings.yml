  aria:
    home: Warpai home
    nav: Main navigation
    download: Download
    menu: Menu
    language: Switch to Chinese
    theme: Toggle color theme
  header:
    download: "Download 1.3.1"
  badge: "Free · Open source · Local-first"
  hero:
    subtitle: The terminal built around agents
    lead: Make an Agent session the unit of work. Collaborate in a shared project, or select a Coordinator to lead parallel development across isolated Git worktrees.
    cta: "Download 1.3.1"
    doc_link: Read the README
    platforms_label: Supported platforms
    features_label: Main features
    features:
      - GPU-accelerated terminal
      - Command blocks
      - Vertical tabs & splits
      - File tree & editor
      - Code review
      - No account · No telemetry
    note: "v1.3.1 · macOS ad-hoc signed · SHA-256 checksums with every release"
    shot_alt: "Warpai workspace with vertical tabs, a source editor and an agent collaboration panel"
  panel:
    kicker: Collaboration panel
    heading: One loop, always visible
    body: Tasks move from assignment to evidence to review. Accepting a result never merges a branch — the Coordinator decides what is integrated.
    head: "Task · evidence review"
    rows:
      - id: t-01
        title: Export command
        who: Agent A · worktree A
        state: running
        tone: run
      - id: t-02
        title: Regression tests
        who: Agent B · worktree B
        state: in review
        tone: review
      - id: t-03
        title: Docs update
        who: Agent C · worktree C
        state: accepted
        tone: done
    result: Reviewer inspected submitted diff and test runs, then accepted the result. The Coordinator integrates accepted work and makes the final commit.
    ready: "2 of 3 tasks accepted"
    foot_link: How it works
  pocket:
    kicker: Local and remote
    heading: Same workflow, every machine
    body: Desktop app for macOS and Windows. SSH projects and Companion for Linux, macOS and Windows — the same panels follow you.
    shots:
      - alt: "Warpai desktop workspace with vertical tabs and the collaboration panel"
        title: Warpai
      - alt: "Warpai SSH project connected to a remote agent"
        title: Warpai · SSH
      - alt: "Agent collaboration panel observing a remote project"
        title: Warpai · SSH panel
  close:
    kicker: Get started
    heading_line: Bring your agents to
    body: One project, many agents, one coordinated workflow — locally or over SSH.
    primary: "Download 1.3.1"
    secondary: All downloads
  footer:
    links:
      - label: Releases
        url: https://github.com/OthinusG/warpai/releases
      - label: README
        url: https://github.com/OthinusG/warpai/blob/main/README.md
      - label: Issues
        url: https://github.com/OthinusG/warpai/issues
      - label: "AGPL-3.0"
        url: https://github.com/OthinusG/warpai/blob/main/LICENSE-AGPL
    note: "© 2026 Warpai · Independently maintained"
  meta:
    title: "Warpai — The terminal built around agents"
    description: "Warpai manages Agent sessions as the unit of work — a full-featured native terminal for macOS and Windows, with project coordination locally and over SSH."
    og_alt: "Warpai — The terminal built around agents"

