{% assign s = site.data.strings[page.lang] %}
<!doctype html>
<html lang="{{ s.lang_code }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ s.meta.title }}</title>
<meta name="description" content="{{ s.meta.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ '/' | absolute_url }}">
<link rel="alternate" hreflang="zh-CN" href="{{ '/zh/' | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ s.meta.title }}">
<meta property="og:description" content="{{ s.meta.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/warpai-social-preview.jpg' | absolute_url }}">
<meta property="og:image:alt" content="{{ s.meta.og_alt }}">
<meta name="twitter:card" content="summary_large_image">
<script>
(function () {
  var t = null;
  try {
    var q = new URLSearchParams(location.search).get('theme');
    if (q === 'dark' || q === 'light') { t = q; localStorage.setItem('warpai-theme', q); }
    else { t = localStorage.getItem('warpai-theme'); }
  } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  if (t === 'dark') document.documentElement.classList.add('dark');
  document.documentElement.style.colorScheme = t;
})();
</script>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
{% include header.html s=s %}
<main class="site-main">
{{ content }}
</main>
{% include footer.html s=s %}
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
